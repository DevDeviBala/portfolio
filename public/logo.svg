<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B8BBE"/>
      <stop offset="100%" stop-color="#306998"/>
    </linearGradient>
    <linearGradient id="pyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE873"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>
  </defs>

  <!-- Background: clean rounded square -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#0d1117"/>

  <!-- db letters, centered, clean bold monospace, no extra marks -->
  <text x="42" y="128" text-anchor="start" font-family="'JetBrains Mono','Courier New',monospace" font-weight="700" font-size="92">
    <tspan fill="url(#pyBlue)">d</tspan><tspan fill="url(#pyYellow)">b</tspan>
  </text>

  <!-- single thin underscore as quiet terminal nod -->
  <rect x="66" y="144" width="68" height="6" rx="3" fill="#8b949e" opacity="0.55"/>
</svg>
