<svg viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pyBlueL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#357AA8"/>
      <stop offset="100%" stop-color="#255580"/>
    </linearGradient>
    <linearGradient id="pyGoldL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9A100"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Devi in blue, Bala in deep gold (contrasts on white), clean monospace -->
  <text x="0" y="90" font-family="'JetBrains Mono','Courier New',monospace" font-weight="700" font-size="64">
    <tspan fill="url(#pyBlueL)">Devi</tspan><tspan fill="#57606a"> </tspan><tspan fill="url(#pyGoldL)">Bala</tspan>
  </text>

  <!-- thin underline echoing the icon mark -->
  <rect x="4" y="106" width="134" height="6" rx="3" fill="#57606a" opacity="0.5"/>
